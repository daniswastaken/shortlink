<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Handaru's Shortlink</title>
    </head>
    <style>
        .main {
            text-align: center;
            height: 100vh;
        }
    </style>
    <body>
        <div class="main">
            <div class="brand">
                <h1>shrtnUrLink</h1>
                <p>Put your link below and get the shortened out url.</p>
            </div>
            <div class="forms">
                <form action="#" method="get" id="submit_link">
                    <input id="the_link" name="the_link" />
                    <button
                        type="submit"
                        value="shorten"
                        form="submit_link"
                        id="submit_link_button"
                    >
                        shorten
                    </button>
                </form>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
